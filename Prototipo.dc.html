<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const follows = {};
    this.directory().forEach((d) => { follows[d.handle] = true; });
    this.staticAvatars = this.buildAvatarUris();
    let vw = 0;
    let vh = 0;
    try {
      // Viewport mobile (iPhone 15 = 393×852 pt): sem isso o Safari usa 980px e o protótipo fica minúsculo
      const ensureMeta = (name, content) => {
        let m = document.querySelector('meta[name="' + name + '"]');
        if (!m) { m = document.createElement('meta'); m.setAttribute('name', name); document.head.appendChild(m); }
        m.setAttribute('content', content);
      };
      ensureMeta('viewport', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
      ensureMeta('apple-mobile-web-app-capable', 'yes');
      ensureMeta('mobile-web-app-capable', 'yes');
      ensureMeta('apple-mobile-web-app-status-bar-style', 'black');
      ensureMeta('theme-color', '#000000');
      vw = window.innerWidth;
      vh = window.innerHeight;
      const insets = () => {
        try {
          const p = document.createElement('div');
          p.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);';
          document.body.appendChild(p);
          const cs = getComputedStyle(p); const r = { t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0 };
          p.remove(); return r;
        } catch (e) { return { t: 0, b: 0 }; }
      };
      const measure = () => { const i = insets(); this.setState({ vw: window.innerWidth, vh: window.innerHeight, insetT: i.t, insetB: i.b }); };
      window.addEventListener('resize', measure);
      window.addEventListener('orientationchange', () => setTimeout(measure, 150));
      setTimeout(measure, 60);
      setTimeout(measure, 400);
    } catch (err) { /* sem janela: tamanho original */ }
    const saved = this.loadSaved();
    const myCfg = saved.avatarCfg ? Object.assign({}, this.avatarConfigs()['@marina.rolls'], saved.avatarCfg) : this.avatarConfigs()['@marina.rolls'];
    this.state = {
      vw: vw,
      vh: vh,
      screen: 'inicio',
      matchMode: 'duo',
      prefsOpen: false,
      myReviews: [
        ['digital', 'Frostpunk', 5, 'Decisões difíceis e uma tensão que não solta até o fim.', 'há 3 dias'],
        ['digital', 'Firewatch', 5, 'Atmosfera impecável. Joguei de uma sentada até as três da manhã.', 'há 1 semana'],
        ['digital', 'A Short Hike', 3, 'Pequeno, bonito e gostoso de explorar sem pressa.', 'há 3 semanas'],
        ['analog', 'Azul', 5, 'Montar já é parte da graça. Mesa de quatro funcionou perfeitamente.', 'há 5 dias'],
        ['analog', 'Century: Spice Road', 4, 'Economia apertada e muitas decisões difíceis em poucas rodadas.', 'há 2 semanas'],
        ['analog', 'Agricola', 4, 'Leve para explicar, profundo para quem repete a partida.', 'há 1 mês']
      ].map((x) => { let h = 0; for (let i = 0; i < x[1].length; i++) h = (h * 31 + x[1].charCodeAt(i)) % 100003; return { id: 'seed-' + x[1].toLowerCase().replace(/[^a-z0-9]+/g, '-'), mode: x[0], game: x[1], gameIdx: h % 14, rating: x[2], text: x[3], tags: [], when: x[4], seed: true }; }),
      ratings: {},
      follows: follows,
      viewHandle: null,
      rateTarget: null,
      forumsView: { topic: null, from: null },
      chatHandle: null,
      mySquads: [],
      squadChats: {},
      squadUnread: {},
      squadChatId: null,
      inboxOpen: false,
      inboxFilter: 'todas',
      gameView: null,
      avatarCfg: myCfg,
      avatarUri: this.uri(myCfg),
      profile: { nome: saved.profile ? saved.profile.nome : undefined, bio: saved.profile ? saved.profile.bio : undefined },
      avatarOpen: false,
      onboarding: true,
      platforms: ['PC', 'Switch'],
      duoModality: 'ambos',
      menuOpen: false,
      roomOpen: false,
      roomVisit: null,
      roomAdmit: null,
      notifsOpen: false,
      notifs: [
        { id: 'n1', kind: 'quarto', handle: '@rafabtt', who: 'Rafa Bittencourt', text: 'te convidou pro quarto dele.', when: 'Agora', group: 'hoje', read: false },
        { id: 'n2', kind: 'match', handle: '@yaz.codes', who: 'Yasmin Prado', text: 'deu match com você em Elden Ring. Mande um oi!', when: '12 min', group: 'hoje', read: false },
        { id: 'n3', kind: 'squad', handle: '@lari.dados', who: 'Noite de Catan', text: 'tem vaga pra você: o squad fechou 3 de 4.', when: '40 min', group: 'hoje', read: false },
        { id: 'n4', kind: 'avaliacao', handle: '@lari.dados', who: 'Larissa K.', text: 'avaliou seu perfil depois da partida.', quote: '“Carrega o time e é super paciente.”', when: '2 h', group: 'hoje', read: false },
        { id: 'n5', kind: 'curtida', handle: '@theov', who: 'Théo Vasques e mais 4', text: 'curtiram sua avaliação de Catan.', when: 'Ontem', group: 'antes', read: true },
        { id: 'n6', kind: 'forum', handle: '@cadu.plays', who: 'Camila Duarte', text: 'respondeu seu tópico em Fóruns.', quote: '“Pandemic é perfeito pra dupla, recomendo muito.”', when: 'Ontem', group: 'antes', read: true },
        { id: 'n7', kind: 'pedido', handle: '@sofi.alm', who: 'Sofia Almeida', text: 'pediu pra entrar no seu quarto.', when: '2 dias', group: 'antes', read: true },
        { id: 'n8', kind: 'seguir', handle: '@pedrosalg', who: 'Pedro Salgado', text: 'começou a seguir você.', when: '3 dias', group: 'antes', read: true }
      ],
      room: saved.room || null,
      settingsOpen: false,
      profileCfg: saved.profileCfg || null,

    else if (style === 'pequena') { R(15, 18, 16, 18, dk); }

  mixLight(hex) {
    const n = parseInt(hex.slice(1), 16);
    const f = (c) => Math.round(c + (255 - c) * 0.6);
    const r = f((n >> 16) & 255), g = f((n >> 8) & 255), b = f(n & 255);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  buildReviewer(handle) {
    const d = this.directory().filter((x) => x.handle === handle)[0];
    if (!d) return null;
    const pal = this.palette()[d.pal];
    const mine = this.state.ratings[handle];
    const rep = Object.assign({}, d.rep);
    if (mine) {
      ['carry', 'chill', 'rage', 'again'].forEach((k) => { rep[k] = (d.rep[k] * d.rep.n + mine[k]) / (d.rep.n + 1); });
      rep.n = d.rep.n + 1;
    }
    const testimonials = d.testimonials.slice();
    if (mine && mine.comment) testimonials.unshift({ from: 'Você', handle: '@marina.rolls', pal: 0, text: mine.comment });
    return {
      id: handle, handle: handle, name: d.name, bg: pal.bg, body: pal.body, light: this.mixLight(pal.body),
      pix24: { bg: pal.bg, body: pal.body, accent: pal.accent },
      bio: d.bio, city: d.city, since: d.since, stats: d.stats, library: d.library, games: d.library.slice(0, 3), common: [],
      rep: rep, testimonials: testimonials, followsYou: d.followsYou,
      friend: !!this.state.follows[handle] && d.followsYou, matched: false, rated: !!mine
    };
